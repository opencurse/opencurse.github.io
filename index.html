<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusView Pro</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e5e5e5; }
    .glass-panel { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .img-checkerboard { background-image: repeating-conic-gradient(#111 0% 25%, #0a0a0a 0% 50%); background-position: 0 0, 10px 10px; background-size: 20px 20px; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    pre code { font-family: 'Fira Code', monospace !important; font-size: 13px !important; }
    .drop-active { border: 2px dashed #3b82f6 !important; background: rgba(59, 130, 246, 0.05) !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

  <header class="w-full max-w-6xl flex flex-col md:flex-row justify-between items-center gap-6 mb-10">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
        <i data-lucide="layers" class="text-white w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold tracking-tighter">Nexus<span class="text-blue-500">View</span></h1>
        <p id="metaInfo" class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Awaiting Input</p>
      </div>
    </div>

    <div class="flex items-center gap-2 bg-neutral-900 p-1.5 rounded-xl border border-white/5 w-full md:w-auto">
      <input id="shareLink" placeholder="Share link will generate here..." class="bg-transparent text-[11px] px-4 py-2 w-full md:w-80 focus:outline-none text-blue-400 font-mono" readonly>
      <button onclick="copyLink()" id="copyBtn" class="flex items-center gap-2 bg-white text-black px-4 py-2 rounded-lg font-bold text-xs hover:bg-blue-500 hover:text-white transition-all">
        <i data-lucide="share-2" class="w-3.5 h-3.5"></i> SHARE
      </button>
    </div>
  </header>

  <main id="dropZone" class="w-full max-w-6xl glass-panel rounded-[2rem] overflow-hidden shadow-2xl min-h-[70vh] flex flex-col relative transition-all">
    
    <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center z-10 cursor-pointer" onclick="document.getElementById('fileInput').click()">
      <i data-lucide="upload-cloud" class="w-16 h-16 text-neutral-700 mb-4"></i>
      <h2 class="text-xl font-medium text-white">Drop or Click to View</h2>
      <p class="text-gray-500 text-sm mt-1">Supports Images, Videos, PDFs, and Code</p>
      <input type="file" id="fileInput" class="hidden" />
    </div>

    <div id="viewerContent" class="hidden w-full h-full flex-grow flex flex-col"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const viewerContent = document.getElementById("viewerContent");
    const emptyState = document.getElementById("emptyState");
    const metaInfo = document.getElementById("metaInfo");
    const shareLink = document.getElementById("shareLink");

    lucide.createIcons();

    // 1. URL Handler
    let q = params.get("q");
    if (q) {
      if (q.startsWith('data:')) {
        processDataUri(q);
      } else {
        if (q.includes("github.com") && !q.includes("raw.githubusercontent.com")) {
            q = q.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
        }
        shareLink.value = window.location.origin + window.location.pathname + "?q=" + encodeURIComponent(q);
        processRemoteFile(q);
      }
    }

    // 2. Drag & Drop
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => {
      dropZone.addEventListener(e, (evt) => { evt.preventDefault(); evt.stopPropagation(); });
    });

    dropZone.addEventListener('dragover', () => dropZone.classList.add('drop-active'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drop-active'));
    dropZone.addEventListener('drop', (e) => {
      dropZone.classList.remove('drop-active');
      handleLocalFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => handleLocalFile(e.target.files[0]));

    // 3. File Processing
    function handleLocalFile(file) {
      if(!file) return;
      const reader = new FileReader();
      
      // For local files, we create a shareable Data URL if the file is small (< 2MB)
      if (file.size < 2000000) {
        reader.onload = (e) => {
          const dataUri = e.target.result;
          shareLink.value = window.location.origin + window.location.pathname + "?q=" + encodeURIComponent(dataUri).substring(0, 5000) + "...[LocalOnly]";
          // Note: Full URL would be too long for many browsers if > 8kb, so we show it as a preview.
          // For actual rendering we use the blob:
          renderByBlob(file);
        };
        reader.readAsDataURL(file);
      } else {
        shareLink.value = window.location.origin + window.location.pathname + "?q=local_file_" + file.name;
        renderByBlob(file);
      }
    }

    function renderByBlob(file) {
      const url = URL.createObjectURL(file);
      const ext = file.name.split('.').pop().toLowerCase();
      if (file.type.startsWith('image/')) renderImage(url, file.name);
      else if (file.type.startsWith('video/')) renderVideo(url, file.name);
      else if (file.type.startsWith('audio/')) renderAudio(url, file.name);
      else if (file.type === 'application/pdf') renderPDF(url, file.name);
      else {
        const reader = new FileReader();
        reader.onload = (e) => renderText(e.target.result, ext, file.name);
        reader.readAsText(file);
      }
    }

    async function processRemoteFile(url) {
      showLoading();
      const name = decodeURIComponent(url.split('/').pop().split(/[#?]/)[0]);
      const ext = name.split('.').pop().toLowerCase();
      
      if (url.match(/\.(jpg|jpeg|png|gif|webp|svg)$/i)) renderImage(url, name);
      else if (url.match(/\.(mp4|webm)$/i)) renderVideo(url, name);
      else if (url.match(/\.(pdf)$/i)) renderPDF(url, name);
      else {
        try {
          const res = await fetch(url);
          const text = await res.text();
          renderText(text, ext, name);
        } catch(e) {
          viewerContent.innerHTML = `<div class="p-20 text-center text-red-400">CORS Policy blocked access. Please download and drag the file.</div>`;
        }
      }
    }

    function processDataUri(uri) {
        // Handle images/files shared via DataURI in URL
        const mockName = "Shared_File";
        if (uri.includes('image/')) renderImage(uri, mockName);
        else renderText("Data URI detected. Unable to parse complex formats from URL string.", "txt", mockName);
    }

    // 4. UI Elements
    function showLoading() {
      emptyState.classList.add('hidden');
      viewerContent.classList.remove('hidden');
      viewerContent.innerHTML = `<div class="flex-grow flex items-center justify-center"><div class="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div></div>`;
    }

    function renderImage(src, name) {
      showLoading();
      metaInfo.innerText = `Image | ${name}`;
      viewerContent.innerHTML = `<div class="img-checkerboard flex-grow flex items-center justify-center p-8"><img src="${src}" class="max-w-full max-h-[70vh] rounded-lg shadow-2xl"></div>`;
    }

    function renderVideo(src, name) {
      showLoading();
      metaInfo.innerText = `Video | ${name}`;
      viewerContent.innerHTML = `<video src="${src}" controls autoplay class="w-full h-full"></video>`;
    }

    function renderText(content, ext, name) {
      showLoading();
      metaInfo.innerText = `Source | ${name}`;
      const safe = content.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
      viewerContent.innerHTML = `
        <div class="bg-[#0d0d0d] px-6 py-3 border-b border-white/5 flex justify-between items-center text-[10px] font-mono text-gray-500 uppercase">
          <span>${ext}</span>
          <div class="flex gap-1"><span class="w-2 h-2 rounded-full bg-neutral-800"></span><span class="w-2 h-2 rounded-full bg-neutral-800"></span></div>
        </div>
        <div class="overflow-auto custom-scrollbar flex-grow bg-[#0d0d0d]"><pre class="m-0"><code class="language-${ext}">${safe}</code></pre></div>`;
      hljs.highlightAll();
    }

    function renderPDF(src, name) {
        showLoading();
        metaInfo.innerText = `Document | ${name}`;
        viewerContent.innerHTML = `<iframe src="${src}" class="w-full h-[80vh] border-none"></iframe>`;
    }

    function copyLink() {
      if(!shareLink.value) return;
      navigator.clipboard.writeText(shareLink.value);
      const btn = document.getElementById('copyBtn');
      btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> COPIED!`;
      lucide.createIcons();
      setTimeout(() => { btn.innerHTML = `<i data-lucide="share-2" class="w-3.5 h-3.5"></i> SHARE`; lucide.createIcons(); }, 2000);
    }
  </script>
</body>
</html>
