<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Calc | Professional Edition</title>
    <style>
        :root {
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --accent: #38bdf8;
            --text: #f8fafc;
            --btn-hover: rgba(255, 255, 255, 0.1);
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text);
        }

        .calculator {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 360px;
        }

        #display {
            width: 100%;
            height: 80px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 2.5rem;
            text-align: right;
            margin-bottom: 1.5rem;
            outline: none;
            font-weight: 300;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 65px;
            border-radius: 16px;
            border: none;
            background: var(--glass);
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background: var(--btn-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .operator { color: var(--accent); font-weight: 700; }
        .clear { color: #f43f5e; }
        .equals { 
            background: var(--accent); 
            color: #000; 
            grid-column: span 2; 
        }
        .equals:hover { background: #7dd3fc; }

        .brand {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            opacity: 0.5;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="brand">Quantum Calc v1.0</div>
    <input type="text" id="display" disabled placeholder="0">
    
    <div class="grid">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="appendOperator('**')">x<sup>y</sup></button>
        <button class="operator" onclick="calculateRoot()">√</button>
        <button class="operator" onclick="appendOperator('/')">÷</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="appendOperator('*')">×</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="appendOperator('-')">-</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="appendOperator('+')">+</button>

        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendNumber('.')">.</button>
        <button class="equals" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendNumber(num) {
        if (display.value === 'Error') display.value = '';
        display.value += num;
    }

    function appendOperator(op) {
        if (display.value === '' || display.value === 'Error') return;
        const lastChar = display.value.slice(-1);
        if (['+', '-', '*', '/', '**'].includes(lastChar)) return;
        display.value += op;
    }

    function clearDisplay() {
        display.value = '';
    }

    function calculateRoot() {
        try {
            display.value = Math.sqrt(eval(display.value));
        } catch {
            display.value = 'Error';
        }
    }

    function calculate() {
        try {
            // eval is okay for a local calc, but for real apps use a parser
            display.value = eval(display.value);
        } catch {
            display.value = 'Error';
        }
    }
</script>

</body>
</html>
