<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum v2 | Pro Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --card-bg: rgba(10, 10, 10, 0.8);
            --accent: #ffffff;
            --accent-dim: #888888;
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #0070f3; /* Next.js Blue */
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 112, 243, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 0, 128, 0.05) 0px, transparent 50%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .calc-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 80px rgba(0,0,0,0.5);
        }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .calc-container {
                max-width: 90%;
                padding: 15px;
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-dim);
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .display-area {
            margin-bottom: 25px;
            padding: 10px;
            text-align: right;
        }

        #history {
            font-size: 0.9rem;
            color: var(--accent-dim);
            height: 20px;
            margin-bottom: 5px;
        }

        #main-display {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 3.5rem;
            font-weight: 300;
            text-align: right;
            outline: none;
            cursor: default;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            aspect-ratio: 1/1;
            border-radius: 18px;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.03);
            color: var(--accent);
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .op-btn {
            color: var(--neon-blue);
            font-weight: 600;
            background: rgba(0, 112, 243, 0.05);
        }

        .special-btn {
            color: #ff0080;
        }

        .eq-btn {
            background: var(--accent);
            color: #000;
            grid-column: span 2;
            aspect-ratio: auto;
            font-weight: 600;
        }

        .eq-btn:hover {
            background: #e0e0e0;
            color: #000;
        }

        /* Keyboard Focus Style */
        .key-active {
            background: rgba(255, 255, 255, 0.2) !important;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="calc-container">
    <div class="header">
        <span>Quantum Compute</span>
        <div class="status-dot"></div>
    </div>

    <div class="display-area">
        <div id="history"></div>
        <input type="text" id="main-display" readonly placeholder="0">
    </div>

    <div class="grid">
        <button class="special-btn" onclick="clearAll()">AC</button>
        <button class="op-btn" onclick="insert('**')">xʸ</button>
        <button class="op-btn" onclick="sqRoot()">√</button>
        <button class="op-btn" onclick="insert('/')">÷</button>

        <button onclick="insert('7')">7</button>
        <button onclick="insert('8')">8</button>
        <button onclick="insert('9')">9</button>
        <button class="op-btn" onclick="insert('*')">×</button>

        <button onclick="insert('4')">4</button>
        <button onclick="insert('5')">5</button>
        <button onclick="insert('6')">6</button>
        <button class="op-btn" onclick="insert('-')">−</button>

        <button onclick="insert('1')">1</button>
        <button onclick="insert('2')">2</button>
        <button onclick="insert('3')">3</button>
        <button class="op-btn" onclick="insert('+')">+</button>

        <button onclick="insert('0')">0</button>
        <button onclick="insert('.')">.</button>
        <button class="eq-btn" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('main-display');
    const historyDisp = document.getElementById('history');

    function insert(val) {
        if (display.value === 'Error') clearAll();
        display.value += val;
    }

    function clearAll() {
        display.value = '';
        historyDisp.innerText = '';
    }

    function backspace() {
        display.value = display.value.slice(0, -1);
    }

    function sqRoot() {
        if(!display.value) return;
        historyDisp.innerText = `√(${display.value})`;
        display.value = Math.sqrt(eval(display.value)).toFixed(4).replace(/\.?0+$/, "");
    }

    function calculate() {
        try {
            if(!display.value) return;
            let expression = display.value;
            historyDisp.innerText = expression + " =";
            // Safety: Using Function instead of eval for better context
            let result = new Function('return ' + expression)();
            display.value = Number.isInteger(result) ? result : result.toFixed(4).replace(/\.?0+$/, "");
        } catch (e) {
            display.value = 'Error';
        }
    }

    // --- PC KEYBOARD LOGIC ---
    window.addEventListener('keydown', (e) => {
        const key = e.key;

        // Numbers & Basic Operators
        if (/[0-9]/.test(key)) insert(key);
        if (key === '+') insert('+');
        if (key === '-') insert('-');
        if (key === '*') insert('*');
        if (key === '/') insert('/');
        if (key === '.') insert('.');
        if (key === '^') insert('**'); // x to power y
        
        // Actions
        if (key === 'Enter' || key === '=') {
            e.preventDefault(); // prevent form submit
            calculate();
        }
        if (key === 'Backspace') backspace();
        if (key === 'Escape') clearAll();
    });

    // Handle Paste Support
    window.addEventListener('paste', (e) => {
        const pasteData = (e.clipboardData || window.clipboardData).getData('text');
        if (/^[0-9+\-*/.**()]+$/.test(pasteData)) {
            display.value += pasteData;
        }
    });
</script>

</body>
</html>
