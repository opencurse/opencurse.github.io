<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fib-Quantum | Hyper-Uptime Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d4ff;
            --deep-purple: #1a1a2e;
        }
        body {
            font-family: 'Geist', sans-serif;
            background: radial-gradient(circle at 50% 50%, #0a0a0a 0%, #000 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        .nebula {
            position: fixed;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.05;
            z-index: -1;
        }
        .uptime-badge {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.1);
        }
        /* Custom Fibonacci Grid */
        .fib-grid::-webkit-scrollbar { width: 4px; }
        .fib-grid::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        .fib-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fib-card:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--neon-blue);
            transform: scale(1.05);
            cursor: pointer;
        }
        .fib-card.selected {
            background: var(--neon-blue);
            color: #000;
            border-color: #fff;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row">
    <div class="nebula"></div>

    <div class="fixed top-0 left-0 w-full p-4 flex justify-between items-center z-50 backdrop-blur-md border-b border-white/5">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></div>
            <span class="text-[10px] font-black tracking-widest text-cyan-400">CORE_SYSTEM_ACTIVE</span>
        </div>
        <div class="uptime-badge px-4 py-1 rounded-full flex items-center gap-3">
            <span class="text-[9px] font-mono text-gray-400">UPTIME:</span>
            <span id="uptimeClock" class="text-[10px] font-mono font-bold text-white">00:00:00:00</span>
        </div>
    </div>

    <aside class="w-full md:w-80 border-r border-white/5 pt-20 p-6 flex flex-col gap-6 bg-black/20 overflow-hidden">
        <div>
            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-[0.2em] mb-4">Sequence Library</h3>
            <div id="fibScroll" class="fib-grid h-[30vh] md:h-[70vh] overflow-y-auto grid grid-cols-3 gap-2 pr-2">
                </div>
        </div>
    </aside>

    <main class="flex-1 pt-24 p-6 md:p-12 flex items-center justify-center">
        <div class="max-w-2xl w-full">
            <div class="mb-12">
                <span class="text-xs font-mono text-cyan-500 mb-2 block">QUANTUM MODULE_04</span>
                <h1 class="text-6xl font-black tracking-tighter italic">HYPER <span class="text-cyan-400">ROOT.</span></h1>
            </div>

            <div class="space-y-8">
                <div class="relative group">
                    <label class="text-[10px] font-bold text-gray-600 uppercase tracking-[0.4em] mb-4 block">Multiplier Input</label>
                    <input type="number" id="userInput" placeholder="ENTER SEED..." 
                        class="w-full bg-transparent border-b-2 border-white/10 py-6 text-5xl font-black focus:outline-none focus:border-cyan-400 transition-all placeholder:opacity-10">
                </div>

                <div class="p-6 rounded-3xl bg-white/5 border border-white/10 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] text-gray-500 uppercase">Current Selected Fib</p>
                        <p id="activeFibDisplay" class="text-2xl font-bold text-cyan-400">1</p>
                    </div>
                    <button onclick="calculate()" class="px-10 py-5 bg-white text-black font-black rounded-2xl hover:bg-cyan-400 hover:scale-105 transition-all active:scale-95">
                        RUN SYNTHESIS
                    </button>
                </div>

                <div id="outputArea" class="hidden animate-in fade-in slide-in-from-bottom-10 duration-700">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-8 rounded-3xl bg-cyan-400/10 border border-cyan-400/20">
                            <p class="text-[10px] text-cyan-500 font-bold uppercase mb-2">Matrix Product</p>
                            <p id="prodOut" class="text-2xl font-bold">0</p>
                        </div>
                        <div class="p-8 rounded-3xl bg-white text-black">
                            <p class="text-[10px] font-bold uppercase mb-2 opacity-50">Derived Root</p>
                            <p id="rootOut" class="text-4xl font-black tracking-tighter">0</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 1. Uptime Counter Logic
        let startTime = Date.now();
        function updateUptime() {
            let now = Date.now();
            let diff = now - startTime;
            let h = Math.floor(diff / 3600000).toString().padStart(2, '0');
            let m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            let s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            let ms = Math.floor((diff % 1000) / 10).toString().padStart(2, '0');
            document.getElementById('uptimeClock').innerText = `${h}:${m}:${s}:${ms}`;
        }
        setInterval(updateUptime, 50);

        // 2. Generate All Fibonacci Numbers
        let selectedFib = 1;
        function generateFibs(limit) {
            let fibs = [1, 2];
            for (let i = 2; i < limit; i++) {
                fibs[i] = fibs[i - 1] + fibs[i - 2];
            }
            const container = document.getElementById('fibScroll');
            fibs.forEach((num, index) => {
                const card = document.createElement('div');
                card.className = `fib-card p-4 rounded-xl text-center text-xs font-mono ${index === 0 ? 'selected' : ''}`;
                card.innerText = num > 1000000 ? (num/1000000).toFixed(1) + 'M' : num;
                card.onclick = () => {
                    document.querySelectorAll('.fib-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedFib = num;
                    document.getElementById('activeFibDisplay').innerText = num.toLocaleString();
                };
                container.appendChild(card);
            });
        }
        generateFibs(50); // Generates 50 Fibonacci numbers

        // 3. Calculation Engine
        function calculate() {
            const input = parseFloat(document.getElementById('userInput').value);
            if(isNaN(input)) return;

            const product = input * selectedFib;
            const root = Math.sqrt(product);

            document.getElementById('prodOut').innerText = product.toLocaleString();
            document.getElementById('rootOut').innerText = root.toFixed(5);
            document.getElementById('outputArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
