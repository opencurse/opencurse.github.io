<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FibRatio Pro | Precision Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #050505;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e5e7eb;
        }
        .main-card {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 32px;
            position: relative;
            overflow: hidden;
        }
        .main-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }
        input, select {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
        }
        input:focus, select:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2) !important;
        }
    </style>
</head>
<body>

    <div class="main-card w-full max-w-lg p-10 mx-4">
        <div class="flex justify-center mb-6">
            <span class="px-3 py-1 text-[10px] font-bold tracking-widest uppercase bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full">
                Fibonacci Ratio Engine v2.0
            </span>
        </div>

        <h1 class="text-4xl font-extrabold text-center mb-2 tracking-tight">
            Golden <span class="text-indigo-500">Calculator.</span>
        </h1>
        <p class="text-gray-400 text-center text-sm mb-10">Select a Fibonacci ratio and compute the square root.</p>

        <div class="space-y-6">
            <div class="group">
                <label class="text-xs font-bold text-gray-500 ml-1 mb-2 block uppercase tracking-widest">Select Ratio (Level)</label>
                <select id="fibRatio" class="w-full h-14 px-4 rounded-2xl outline-none transition-all appearance-none cursor-pointer">
                    <option value="0.236">0.236 (Weak)</option>
                    <option value="0.382">0.382 (Moderate)</option>
                    <option value="0.5">0.500 (Mid-Point)</option>
                    <option value="0.618" selected>0.618 (Golden Ratio)</option>
                    <option value="0.786">0.786 (Deep)</option>
                    <option value="1.0">1.000 (Full)</option>
                    <option value="1.618">1.618 (Golden Extension)</option>
                    <option value="2.618">2.618 (Super Extension)</option>
                </select>
            </div>

            <div>
                <label class="text-xs font-bold text-gray-500 ml-1 mb-2 block uppercase tracking-widest">Your Number</label>
                <input type="number" id="userInput" placeholder="e.g. 100" 
                    class="w-full h-14 px-4 rounded-2xl outline-none transition-all">
            </div>

            <button onclick="calculate()" class="w-full h-14 bg-white text-black font-bold rounded-2xl hover:bg-indigo-500 hover:text-white transition-all duration-300 transform active:scale-95 shadow-xl shadow-indigo-500/10">
                Compute Result
            </button>
        </div>

        <div id="displayArea" class="hidden mt-10 space-y-4 animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div class="h-px bg-gradient-to-r from-transparent via-gray-800 to-transparent"></div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="p-4 rounded-2xl bg-white/5 border border-white/5">
                    <p class="text-[10px] text-gray-500 uppercase font-bold">Product</p>
                    <p id="productResult" class="text-xl font-semibold text-white">0.00</p>
                </div>
                <div class="p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/20">
                    <p class="text-[10px] text-indigo-400 uppercase font-bold">Square Root</p>
                    <p id="rootResult" class="text-2xl font-bold text-indigo-400 italic">0.00</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const ratio = parseFloat(document.getElementById('fibRatio').value);
            const num = parseFloat(document.getElementById('userInput').value);
            const display = document.getElementById('displayArea');

            if (isNaN(num)) {
                alert("Please enter a valid number!");
                return;
            }

            const product = ratio * num;
            const root = Math.sqrt(product);

            document.getElementById('productResult').innerText = product.toFixed(3);
            document.getElementById('rootResult').innerText = root.toFixed(4);
            
            display.classList.remove('hidden');
        }
    </script>
</body>
</html>
