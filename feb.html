<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FibMath Pro | Professional Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #111827, #000000);
            min-height: 100vh;
            color: white;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        .gradient-text {
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex items-center justify-center p-6">

    <div class="max-w-md w-full glass-card p-8 shadow-2xl">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold gradient-text mb-2">FibMath Pro</h1>
            <p class="text-gray-400 text-sm">Select a sequence, multiply, and find the root.</p>
        </header>

        <div class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Select Fibonacci Number</label>
                <select id="fibSelect" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer">
                    </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Multiplier Input</label>
                <input type="number" id="multiplierInput" placeholder="Enter a number..." 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            </div>

            <button onclick="calculateResult()" 
                class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-4 rounded-xl transition-all transform active:scale-95 shadow-lg">
                Calculate Result
            </button>
        </div>

        <div id="resultCard" class="mt-10 pt-8 border-t border-gray-800 hidden">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">Multiplication:</span>
                    <span id="multValue" class="text-white font-mono text-lg">0</span>
                </div>
                <div class="p-4 bg-blue-500/10 border border-blue-500/20 rounded-2xl">
                    <p class="text-xs text-blue-400 uppercase font-bold mb-1 text-center">Final Square Root</p>
                    <p id="rootValue" class="text-3xl font-bold text-center text-white italic">0</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Generate Fibonacci numbers for the dropdown
        function generateFibonacci(n) {
            let fib = [0, 1];
            for (let i = 2; i < n; i++) {
                fib[i] = fib[i - 1] + fib[i - 2];
            }
            return fib;
        }

        // Initialize the dropdown
        const select = document.getElementById('fibSelect');
        const fibs = generateFibonacci(20); // First 20 fib numbers

        fibs.forEach(num => {
            let option = document.createElement('option');
            option.value = num;
            option.textContent = num;
            select.appendChild(option);
        });

        // Main Calculation Logic
        function calculateResult() {
            const fibNum = parseFloat(document.getElementById('fibSelect').value);
            const multiplier = parseFloat(document.getElementById('multiplierInput').value);
            const resultDiv = document.getElementById('resultCard');

            if (isNaN(multiplier)) {
                alert("Please enter a valid number!");
                return;
            }

            const multiplication = fibNum * multiplier;
            const root = Math.sqrt(multiplication);

            // Display results with a smooth fade-in effect
            document.getElementById('multValue').innerText = multiplication.toLocaleString();
            document.getElementById('rootValue').innerText = root.toFixed(4);
            
            resultDiv.classList.remove('hidden');
            resultDiv.classList.add('animate-pulse');
            setTimeout(() => resultDiv.classList.remove('animate-pulse'), 1000);
        }
    </script>
</body>
</html>
