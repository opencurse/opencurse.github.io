<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FibRatio | Ultimate Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Geist', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dropdown-content {
            display: none;
            animation: slideUp 0.2s ease-out;
        }
        
        .dropdown-content.show { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .history-item {
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        input {
            background: transparent !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            transition: all 0.3s;
        }
        input:focus {
            border-color: #6366f1 !important;
            outline: none;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="flex h-screen">

    <aside class="w-80 glass flex flex-col p-6 hidden md:flex">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-3 h-3 rounded-full bg-indigo-500"></div>
            <h2 class="text-xs font-black tracking-[0.3em] text-gray-400">LOG HISTORY</h2>
        </div>
        
        <div id="historyList" class="flex-1 overflow-y-auto space-y-3">
            <p id="emptyMsg" class="text-gray-600 text-xs italic">No calculations yet...</p>
        </div>

        <div class="mt-auto pt-6 border-t border-white/5">
            <p class="text-[10px] text-gray-500 font-mono italic">Session: Stable v4.0.2</p>
        </div>
    </aside>

    <main class="flex-1 relative flex items-center justify-center p-6 overflow-hidden">
        
        <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[120px]"></div>

        <div class="max-w-xl w-full z-10">
            <div class="mb-12">
                <h1 class="text-5xl font-extrabold tracking-tighter leading-none mb-4">
                    Deep <span class="text-indigo-500">Analytics.</span>
                </h1>
                <p class="text-gray-400 text-lg font-light">Precision Fibonacci mapping & root extraction.</p>
            </div>

            <div class="space-y-8">
                <div class="relative">
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3 block">Select Target Ratio</label>
                    <button onclick="toggleDropdown()" id="dropdownBtn" class="w-full h-16 bg-white/5 border border-white/10 rounded-2xl px-6 flex items-center justify-between hover:bg-white/10 transition-all">
                        <span id="selectedValue" class="font-medium text-indigo-400">0.618 (Golden Ratio)</span>
                        <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    
                    <div id="dropdownMenu" class="dropdown-content absolute top-full left-0 w-full mt-2 bg-[#0f0f0f] border border-white/10 rounded-2xl overflow-hidden z-50 shadow-2xl">
                        <div class="grid grid-cols-2 p-2 gap-1">
                            <div onclick="selectRatio(0.236, '0.236 (Weak)')" class="p-4 hover:bg-indigo-600 rounded-xl cursor-pointer text-sm transition-colors">0.236</div>
                            <div onclick="selectRatio(0.382, '0.382 (Moderate)')" class="p-4 hover:bg-indigo-600 rounded-xl cursor-pointer text-sm transition-colors">0.382</div>
                            <div onclick="selectRatio(0.5, '0.500 (Base)')" class="p-4 hover:bg-indigo-600 rounded-xl cursor-pointer text-sm transition-colors">0.500</div>
                            <div onclick="selectRatio(0.618, '0.618 (Golden)')" class="p-4 hover:bg-indigo-600 rounded-xl cursor-pointer text-sm transition-colors">0.618</div>
                            <div onclick="selectRatio(1.618, '1.618 (Ext)')" class="p-4 hover:bg-indigo-600 rounded-xl cursor-pointer text-sm transition-colors">1.618</div>
                            <div onclick="selectRatio(2.618, '2.618 (Hyper)')" class="p-4 hover:bg-indigo-600 rounded-xl cursor-pointer text-sm transition-colors">2.618</div>
                            <div onclick="selectRatio(3.618, '3.618 (Ultra)')" class="p-4 hover:bg-indigo-600 rounded-xl cursor-pointer text-sm transition-colors">3.618</div>
                            <div onclick="selectRatio(4.236, '4.236 (Max)')" class="p-4 hover:bg-indigo-600 rounded-xl cursor-pointer text-sm transition-colors">4.236</div>
                        </div>
                    </div>
                </div>

                <div class="relative">
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3 block">Value Input</label>
                    <input type="number" id="valInput" placeholder="Enter numeric value..." class="w-full h-16 px-6 rounded-2xl text-xl font-semibold">
                </div>

                <button onclick="runCalculation()" class="w-full h-16 bg-white text-black font-black rounded-2xl text-sm uppercase tracking-widest hover:scale-[1.02] active:scale-95 transition-all shadow-xl shadow-white/5">
                    Execute Analysis
                </button>

                <div id="resultArea" class="hidden animate-in fade-in slide-in-from-bottom-8 duration-700">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-6 rounded-3xl border border-white/5 bg-white/[0.02]">
                            <span class="text-[10px] text-gray-500 font-bold uppercase">Multiplied</span>
                            <div id="resMult" class="text-2xl font-bold mt-1 tracking-tight italic text-gray-300">0</div>
                        </div>
                        <div class="p-6 rounded-3xl border border-indigo-500/30 bg-indigo-500/5">
                            <span class="text-[10px] text-indigo-400 font-bold uppercase tracking-widest">Final Root</span>
                            <div id="resRoot" class="text-4xl font-black mt-1 tracking-tighter text-white">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentRatio = 0.618;

        function toggleDropdown() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        function selectRatio(val, label) {
            currentRatio = val;
            document.getElementById('selectedValue').innerText = label;
            toggleDropdown();
        }

        function runCalculation() {
            const inputVal = parseFloat(document.getElementById('valInput').value);
            if(isNaN(inputVal)) return;

            const product = currentRatio * inputVal;
            const root = Math.sqrt(product);

            // Update UI
            document.getElementById('resMult').innerText = product.toFixed(3);
            document.getElementById('resRoot').innerText = root.toFixed(5);
            document.getElementById('resultArea').classList.remove('hidden');

            // Add to History
            addToHistory(currentRatio, inputVal, root);
        }

        function addToHistory(r, i, res) {
            const list = document.getElementById('historyList');
            const empty = document.getElementById('emptyMsg');
            if(empty) empty.remove();

            const item = document.createElement('div');
            item.className = "history-item p-4 rounded-xl";
            item.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[10px] text-indigo-500 font-bold">RATIO ${r}</span>
                    <span class="text-[10px] text-gray-600 font-mono">${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="text-sm font-semibold tracking-tight">√(${r} × ${i}) = ${res.toFixed(3)}</div>
            `;
            list.prepend(item);
        }

        // Close dropdown when clicking outside
        window.onclick = function(event) {
            if (!event.target.closest('#dropdownBtn')) {
                document.getElementById('dropdownMenu').classList.remove('show');
            }
        }
    </script>
</body>
</html>
