<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL-FIB | AI Quant Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff;
            --neural-purple: #7000ff;
        }
        body {
            font-family: 'Geist', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        /* Futuristic Grid Background */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            z-index: -1;
        }
        .glow-sphere {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--neural-purple) 0%, transparent 70%);
            filter: blur(120px);
            opacity: 0.15;
            z-index: -1;
            animation: drift 20s infinite alternate;
        }
        @keyframes drift {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(20%, 20%); }
        }
        /* AI Pulse Effect */
        .ai-pulse {
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
            border: 1px solid rgba(0, 242, 255, 0.2);
            animation: pulse 4s infinite;
        }
        @keyframes pulse {
            0%, 100% { border-color: rgba(0, 242, 255, 0.2); box-shadow: 0 0 20px rgba(0, 242, 255, 0.1); }
            50% { border-color: rgba(0, 242, 255, 0.5); box-shadow: 0 0 40px rgba(0, 242, 255, 0.2); }
        }
        /* Custom Scrollbar for Terminal Look */
        #historyList::-webkit-scrollbar { width: 2px; }
        #historyList::-webkit-scrollbar-thumb { background: var(--neon); }
    </style>
</head>
<body class="flex flex-col md:flex-row">
    <div class="grid-bg"></div>
    <div class="glow-sphere"></div>

    <aside class="w-full md:w-72 bg-black/40 backdrop-blur-3xl border-r border-white/5 p-6 flex flex-col gap-6">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full border-2 border-cyan-500 flex items-center justify-center">
                <div class="w-2 h-2 bg-cyan-500 rounded-full animate-ping"></div>
            </div>
            <h1 class="text-xs font-black tracking-[0.4em] uppercase opacity-80">Neural.Core</h1>
        </div>

        <div class="flex-1 overflow-hidden flex flex-col">
            <p class="text-[10px] text-gray-500 font-mono mb-4 uppercase">/root/logs/history</p>
            <div id="historyList" class="flex-1 overflow-y-auto space-y-4 font-mono text-[11px] text-cyan-500/60">
                <div class="opacity-30 italic">Initialize system to log data...</div>
            </div>
        </div>

        <div class="pt-6 border-t border-white/5">
            <div class="flex items-center justify-between text-[10px] font-mono text-gray-500">
                <span>LATENCY: 4ms</span>
                <span class="text-green-500">ENCRYPTED</span>
            </div>
        </div>
    </aside>

    <main class="flex-1 p-6 md:p-12 overflow-y-auto">
        <div class="max-w-5xl mx-auto">
            <header class="mb-16">
                <h2 class="text-6xl font-black tracking-tighter mb-4 italic uppercase">
                    Quantum <span class="text-transparent" style="-webkit-text-stroke: 1px white;">Synthesis</span>
                </h2>
                <div class="h-1 w-24 bg-gradient-to-r from-cyan-500 to-purple-600"></div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-7 space-y-8">
                    <div class="ai-pulse p-8 rounded-[40px] bg-white/[0.02] backdrop-blur-md">
                        <label class="text-[10px] font-black text-cyan-400 uppercase tracking-widest block mb-6">Matrix Ratio Selection</label>
                        
                        <div class="grid grid-cols-4 gap-2 mb-10">
                            <button onclick="setMatrix(0.382, this)" class="ratio-btn border border-white/10 p-3 rounded-xl text-[10px] font-bold hover:bg-white/5 transition-all">0.382</button>
                            <button onclick="setMatrix(0.618, this)" class="ratio-btn border border-cyan-500/50 bg-cyan-500/10 p-3 rounded-xl text-[10px] font-bold transition-all">0.618</button>
                            <button onclick="setMatrix(1.618, this)" class="ratio-btn border border-white/10 p-3 rounded-xl text-[10px] font-bold hover:bg-white/5 transition-all">1.618</button>
                            <button onclick="setMatrix(2.618, this)" class="ratio-btn border border-white/10 p-3 rounded-xl text-[10px] font-bold hover:bg-white/5 transition-all">2.618</button>
                        </div>

                        <div class="relative group">
                            <input type="number" id="quantInput" placeholder="INPUT QUANTUM VALUE" 
                                class="w-full bg-transparent border-b-2 border-white/10 py-6 text-4xl font-black focus:outline-none focus:border-cyan-500 transition-all uppercase placeholder:text-white/5">
                            <span class="absolute right-0 bottom-6 text-[10px] font-mono text-gray-500 group-focus-within:text-cyan-500">VAL_ENTRY</span>
                        </div>

                        <button onclick="synthesize()" class="mt-12 w-full py-6 bg-cyan-500 text-black font-black uppercase tracking-[0.5em] text-sm rounded-full hover:bg-white hover:scale-[1.02] transition-all active:scale-95">
                            Synthesize Results
                        </button>
                    </div>
                </div>

                <div class="lg:col-span-5 space-y-6">
                    <div class="border border-white/10 rounded-[40px] p-8 bg-black/60 relative overflow-hidden h-full flex flex-col justify-between">
                        <div class="absolute top-0 right-0 p-8 opacity-20">
                            <svg class="w-24 h-24 text-purple-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2z"/></svg>
                        </div>

                        <div>
                            <span class="text-[10px] font-bold text-purple-400 uppercase tracking-widest">AI Derivation Insight</span>
                            <div id="aiText" class="mt-4 text-gray-400 text-sm leading-relaxed font-mono">
                                System Idle. Waiting for quantum input strings...
                            </div>
                        </div>

                        <div id="resultDisplay" class="hidden animate-in fade-in zoom-in duration-500">
                            <div class="mt-8 space-y-2">
                                <p class="text-[10px] text-gray-500 uppercase">Computed Root</p>
                                <div id="finalVal" class="text-6xl font-black tracking-tighter text-white">0.00</div>
                                <div id="subVal" class="text-xs font-mono text-cyan-500">Product: 0.00</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let selectedRatio = 0.618;

        function setMatrix(val, btn) {
            selectedRatio = val;
            document.querySelectorAll('.ratio-btn').forEach(b => {
                b.classList.remove('border-cyan-500/50', 'bg-cyan-500/10');
                b.classList.add('border-white/10');
            });
            btn.classList.add('border-cyan-500/50', 'bg-cyan-500/10');
            btn.classList.remove('border-white/10');
        }

        function synthesize() {
            const input = parseFloat(document.getElementById('quantInput').value);
            if(isNaN(input)) return;

            const product = input * selectedRatio;
            const root = Math.sqrt(product);

            // UI Reveal
            document.getElementById('resultDisplay').classList.remove('hidden');
            document.getElementById('finalVal').innerText = root.toFixed(5);
            document.getElementById('subVal').innerText = `NETWORK_PRODUCT: ${product.toFixed(3)}`;

            // AI Insight Simulation
            const insights = [
                `Analysis complete. The root value shows a strong ${selectedRatio} correlation within the neural matrix.`,
                `Quantum derivation successful. Data points align with harmonic Fibonacci expansion.`,
                `Synthesis finished. The resultant vector suggests a stable convergence at ${root.toFixed(2)}.`
            ];
            document.getElementById('aiText').innerText = insights[Math.floor(Math.random() * insights.length)];

            // Log Update
            const log = document.getElementById('historyList');
            if(log.innerHTML.includes("Initialize")) log.innerHTML = '';
            
            const entry = document.createElement('div');
            entry.className = "border-l-2 border-cyan-500 pl-3 py-1 animate-in slide-in-from-left-4";
            entry.innerHTML = `
                <div class="text-[9px] opacity-40 uppercase">T: ${new Date().toLocaleTimeString()}</div>
                <div>ROOT -> ${root.toFixed(4)}</div>
            `;
            log.prepend(entry);
        }
    </script>
</body>
</html>
